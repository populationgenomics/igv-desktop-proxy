name: Test
on:
  push:

permissions: {}

jobs:
  unittests:
    name: Run unit tests
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: 1
      BUILDKIT_PROGRESS: plain
      IGV_DOCKER: igvdproxy:dev
    defaults:
      run:
        shell: bash -eo pipefail -l {0}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e #v6.8.0
        with:
          activate-environment: true
          enable-cache: false
          version: 0.8.22 #uv version

      - name: 'build image'
        run: |
          docker build --tag $IGV_DOCKER -f infrastructure/Dockerfile .

      - name: 'Run unit tests'
        id: runtests
        run: |
          rc=0
          uv run pytest --doctest-modules --doctest-continue-on-failure tests/ || rc=$?
          echo "rc=$rc" >> $GITHUB_OUTPUT

      - name: Fail if unit tests are not passing
        if: ${{ steps.runtests.outputs.rc != 0}}
        uses: actions/github-script@v8
        env:
          rc: ${{ steps.runtests.outputs.rc }}
        with:
          script: |
            core.setFailed(`Unittests failed with rc = ${process.env.rc}`)
